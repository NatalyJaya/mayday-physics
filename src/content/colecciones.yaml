- id: examen-parabolico-a
  tipo: examen
  titulo: 'Examen de práctica A: lanzamientos'
  corto: Examen A
  tema: movimiento-parabolico
  fecha: '2026-11-19'
  minutos: 55
  basada_en: cooperativa-2026-10-28
  descripcion: La bola que cae de una mesa y la moto entre rampas, pero sin datos directos. Hay que deducir la velocidad de salida a partir del ángulo de llegada, saltar entre rampas de distinta altura y acertar dentro de una caja.
  fuente: hoja-cooperativa-2026-10-28
  principales: [examen-a1-mesa-angulo, examen-a2-moto-desnivel, examen-a3-mesa-caja]
  instrucciones:
    - 'Toma g = 9,8 m/s² y desprecia el rozamiento con el aire.'
    - 'Usa el método de clase: escribe las ecuaciones de cada eje y conecta los ejes con el tiempo.'
    - Trabaja con al menos tres decimales en los senos y cosenos.
    - Contesta todo lo que pide cada apartado, con unidades.

