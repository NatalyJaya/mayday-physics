titulo: 'PAU: cuerpo lanzado desde un acantilado de 120 m'
tema: movimiento-parabolico
orden: 207
procedencia: alumno
fuente: joan-oro-parabolico
nota_fuente: Ejercicio 7 de la hoja «Exercicis moviment parabòlic» (INS Joan Oró), enunciado en catalán, tal cual. Es de la PAU de septiembre de 1998. Resultado de la hoja, con g = 10 m/s²; 86,6 m/s y 10,74 s.
coleccion: review-parabolico-joan-oro
dificultad: examen
habilidades: [vectores, planteamiento, matematicas]
resumen: Lanzamiento oblicuo hacia arriba desde un acantilado. Velocidad horizontal al llegar al agua e instante en que pasa por 80 m.
enunciado: |
  (PAU setembre 98) Es llança un cos de **5 kg** des d’un penya-segat que està a una alçària de **120 m** sobre l’aigua. La velocitat inicial del cos té un mòdul de **100 m/s** i forma un angle de **30°** amb l’horitzontal. Si la fricció amb l’aire és negligible,

  a) Quant valdrà el component horitzontal de la velocitat en el moment de l’impacte amb l’aigua? b) En quin instant, després de llançar-lo, el cos es troba a una altura de 80 metres sobre l’aigua?
figura:
  tipo: lanzamiento
  v0: 100
  angulo: 30
  h0: 120
  g: 10
  soporte: acantilado
  trayectoria: false
  etiquetas: { v0: '', angulo: '30°', h0: '120 m' }
  ancho: 140
datos:
  - { simbolo: 'm', valor: '5\un{kg}', significado: 'masa (no hace falta: sin rozamiento, no influye)' }
  - { simbolo: 'y_0', valor: '120\un{m}', significado: 'altura del acantilado sobre el agua' }
  - { simbolo: 'v_0', valor: '100\un{m/s}', significado: 'velocidad inicial' }
  - { simbolo: '\alpha', valor: '30^\circ', significado: 'sobre la horizontal' }
  - { simbolo: '\cg{g}', valor: '-10\un{m/s^2}', significado: 'valor que usa la hoja' }
incognitas:
  - 'La componente horizontal de la velocidad al llegar al agua.'
  - 'El instante en que el cuerpo está a 80 m sobre el agua.'
interpretacion: |
  Es un lanzamiento oblicuo **hacia arriba** desde 120 m. El cuerpo sube, llega a un punto más alto y baja hasta el agua. Pasa por los 80 m **una sola vez**: cuando ya baja, por debajo del borde del acantilado. La masa no interviene: sin rozamiento, todos los cuerpos caen igual.
conceptos:
  - 'Sin rozamiento, $\cx{v_x}$ es constante durante todo el vuelo.'
  - '$\cy{y} = 120 + v_0\operatorname{sen}\alpha\cdot t - 5\,t^2$ (con $g = 10\un{m/s^2}$).'
apartados:
  - id: a
    enunciado: 'Quant valdrà el component horitzontal de la velocitat en el moment de l’impacte amb l’aigua?'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: '\cx{v_x}'
          etiqueta: Componente horizontal al llegar al agua
          unidad: m/s
          valor: 86.60
          trampas:
            - { valor: 50, explicacion: 'Esa es la componente **vertical** inicial ($100\operatorname{sen}30^\circ$). La horizontal va con el coseno.' }
            - { valor: 100, explicacion: 'Ese es el módulo de la velocidad inicial. Se pide solo la componente horizontal.' }
    pistas:
      - 'En el eje X no hay aceleración. ¿Cambia $v_x$ durante el vuelo?'
    pasos:
      - titulo: La componente horizontal no cambia
        desarrollo: |
          $$\cx{v_x} = v_0\cos 30^\circ = 100\cdot 0,866 = 86,6\un{m/s}$$
        porque: 'En horizontal no actúa ninguna fuerza (no hay rozamiento), así que $v_x$ es la misma al salir y al llegar al agua. No hace falta calcular el tiempo de vuelo.'
    resultado: 'Al llegar al agua, $v_x = $ **86,6 m/s**, la misma que al principio.'
  - id: b
    enunciado: 'En quin instant, després de llançar-lo, el cos es troba a una altura de 80 metres sobre l’aigua?'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 't'
          etiqueta: Instante en que está a 80 m
          unidad: s
          valor: 10.745
          trampas:
            - { valor: 0.745, explicacion: 'Esa es la otra solución de la ecuación, pero es **negativa** (−0,745 s): sería antes de lanzarlo. Quédate con la positiva.' }
            - { valor: 2.828, explicacion: 'Has planteado una caída libre de 40 m sin velocidad inicial. Pero el cuerpo sale hacia arriba con $v_{0y} = 50\un{m/s}$.' }
    pistas:
      - '$v_{0y} = 100\operatorname{sen}30^\circ = 50\un{m/s}$.'
      - 'Plantea $80 = 120 + 50\,t - 5\,t^2$ y resuelve la ecuación de segundo grado.'
    pasos:
      - titulo: Ecuación del eje Y a 80 m
        desarrollo: |
          $$80 = 120 + 50\,t - 5\,t^2 \;\Rightarrow\; 5\,t^2 - 50\,t - 40 = 0 \;\Rightarrow\; t^2 - 10\,t - 8 = 0$$
      - titulo: Resuelve y elige la solución
        piensa: 'Sale una solución positiva y otra negativa. ¿Cuál tiene sentido?'
        desarrollo: |
          $$t = \frac{10 \pm \sqrt{100 + 32}}{2} = \frac{10 \pm 11,49}{2} \;\Rightarrow\; t = 10,74\un{s}\quad(\text{la otra, } -0,74\un{s},\ \text{se descarta})$$
        porque: '80 m está por debajo del punto de lanzamiento: el cuerpo solo pasa por ahí una vez, cuando ya baja.'
    resultado: 'Está a 80 m sobre el agua a los **10,74 s** de lanzarlo.'
errores:
  - error: 'Pensar que la masa influye'
    explicacion: 'Sin rozamiento, la masa no aparece en ninguna ecuación del movimiento. Los 5 kg son un dato de más.'
  - error: 'Calcular el tiempo de vuelo para el apartado a)'
    explicacion: 'No hace falta: la componente horizontal de la velocidad es constante.'
  - error: 'Tomar y₀ = 0 y la altura final como 80 m'
    explicacion: 'Si el origen está en el agua, el cuerpo empieza en $y_0 = 120\un{m}$ y buscamos cuándo $y = 80\un{m}$.'
laboratorio: { v0: 100, angulo: 30, h0: 120, g: 10 }
