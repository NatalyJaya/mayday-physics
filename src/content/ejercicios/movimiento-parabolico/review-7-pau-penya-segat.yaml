titulo: 'PAU: cos llançat des d’un penya-segat de 120 m'
tema: movimiento-parabolico
orden: 207
procedencia: alumno
fuente: joan-oro-parabolico
nota_fuente: Exercici 7 del full «Exercicis moviment parabòlic» (INS Joan Oró). És de la PAU de setembre de 1998. Resultat del full, amb g = 10 m/s²; 86,6 m/s i 10,74 s.
coleccion: review-parabolico-joan-oro
dificultad: examen
habilidades: [vectores, planteamiento, matematicas]
resumen: Llançament oblic cap amunt des d’un penya-segat. Velocitat horitzontal en arribar a l’aigua i instant en què passa per 80 m.
enunciado: |
  (PAU setembre 98) Es llança un cos de **5 kg** des d’un penya-segat que està a una alçària de **120 m** sobre l’aigua. La velocitat inicial del cos té un mòdul de **100 m/s** i forma un angle de **30°** amb l’horitzontal. Si la fricció amb l’aire és negligible,

  a) Quant valdrà el component horitzontal de la velocitat en el moment de l’impacte amb l’aigua? b) En quin instant, després de llançar-lo, el cos es troba a una altura de 80 metres sobre l’aigua?
figura:
  tipo: lanzamiento
  v0: 100
  angulo: 30
  h0: 120
  g: 10
  soporte: acantilado
  trayectoria: false
  etiquetas: { v0: '', angulo: '30°', h0: '120 m' }
  ancho: 140
datos:
  - { simbolo: 'm', valor: '5\un{kg}', significado: 'massa (no cal: sense fregament, no influeix)' }
  - { simbolo: 'y_0', valor: '120\un{m}', significado: 'alçària del penya-segat sobre l’aigua' }
  - { simbolo: 'v_0', valor: '100\un{m/s}', significado: 'velocitat inicial' }
  - { simbolo: '\alpha', valor: '30^\circ', significado: 'sobre l’horitzontal' }
  - { simbolo: '\cg{g}', valor: '-10\un{m/s^2}', significado: 'valor que fa servir el full' }
incognitas:
  - 'El component horitzontal de la velocitat en arribar a l’aigua.'
  - 'L’instant en què el cos és a 80 m sobre l’aigua.'
interpretacion: |
  És un llançament oblic **cap amunt** des de 120 m. El cos puja, arriba a un punt més alt i baixa fins a l’aigua. Passa pels 80 m **una sola vegada**: quan ja baixa, per sota de la vora del penya-segat. La massa no hi intervé: sense fregament, tots els cossos cauen igual.
conceptos:
  - 'Sense fregament, $\cx{v_x}$ és constant durant tot el vol.'
  - '$\cy{y} = 120 + v_0\operatorname{sin}\alpha\cdot t - 5\,t^2$ (amb $g = 10\un{m/s^2}$).'
apartados:
  - id: a
    enunciado: 'Quant valdrà el component horitzontal de la velocitat en el moment de l’impacte amb l’aigua?'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: '\cx{v_x}'
          etiqueta: Component horitzontal en arribar a l’aigua
          unidad: m/s
          valor: 86.60
          trampas:
            - { valor: 50, explicacion: 'Aquest és el component **vertical** inicial ($100\operatorname{sin}30^\circ$). L’horitzontal va amb el cosinus.' }
            - { valor: 100, explicacion: 'Aquest és el mòdul de la velocitat inicial. Es demana només el component horitzontal.' }
    pistas:
      - 'A l’eix X no hi ha acceleració. Canvia $v_x$ durant el vol?'
    pasos:
      - titulo: El component horitzontal no canvia
        desarrollo: |
          $$\cx{v_x} = v_0\cos 30^\circ = 100\cdot 0,866 = 86,6\un{m/s}$$
        porque: 'En horitzontal no actua cap força (no hi ha fregament), així que $v_x$ és la mateixa en sortir i en arribar a l’aigua. No cal calcular el temps de vol.'
    resultado: 'En arribar a l’aigua, $v_x = $ **86,6 m/s**, la mateixa que al principi.'
  - id: b
    enunciado: 'En quin instant, després de llançar-lo, el cos es troba a una altura de 80 metres sobre l’aigua?'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 't'
          etiqueta: Instant en què és a 80 m
          unidad: s
          valor: 10.745
          trampas:
            - { valor: 0.745, explicacion: 'Aquesta és l’altra solució de l’equació, però és **negativa** (−0,745 s): seria abans de llançar-lo. Queda’t amb la positiva.' }
            - { valor: 2.828, explicacion: 'Has plantejat una caiguda lliure de 40 m sense velocitat inicial. Però el cos surt cap amunt amb $v_{0y} = 50\un{m/s}$.' }
    pistas:
      - '$v_{0y} = 100\operatorname{sin}30^\circ = 50\un{m/s}$.'
      - 'Planteja $80 = 120 + 50\,t - 5\,t^2$ i resol l’equació de segon grau.'
    pasos:
      - titulo: Equació de l’eix Y a 80 m
        desarrollo: |
          $$80 = 120 + 50\,t - 5\,t^2 \;\Rightarrow\; 5\,t^2 - 50\,t - 40 = 0 \;\Rightarrow\; t^2 - 10\,t - 8 = 0$$
      - titulo: Resol i tria la solució
        piensa: 'Surt una solució positiva i una altra de negativa. Quina té sentit?'
        desarrollo: |
          $$t = \frac{10 \pm \sqrt{100 + 32}}{2} = \frac{10 \pm 11,49}{2} \;\Rightarrow\; t = 10,74\un{s}\quad(\text{l’altra, } -0,74\un{s},\ \text{es descarta})$$
        porque: '80 m és per sota del punt de llançament: el cos només hi passa una vegada, quan ja baixa.'
    resultado: 'És a 80 m sobre l’aigua als **10,74 s** de llançar-lo.'
errores:
  - error: 'Pensar que la massa influeix'
    explicacion: 'Sense fregament, la massa no apareix a cap equació del moviment. Els 5 kg són una dada de més.'
  - error: 'Calcular el temps de vol per a l’apartat a)'
    explicacion: 'No cal: el component horitzontal de la velocitat és constant.'
  - error: 'Prendre y₀ = 0 i l’altura final com a 80 m'
    explicacion: 'Si l’origen és a l’aigua, el cos comença a $y_0 = 120\un{m}$ i busquem quan $y = 80\un{m}$.'
laboratorio: { v0: 100, angulo: 30, h0: 120, g: 10 }
