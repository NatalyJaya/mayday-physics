titulo: Proyectil a 100 m/s y 60°
tema: movimiento-parabolico
orden: 203
procedencia: alumno
fuente: joan-oro-parabolico
nota_fuente: Ejercicio 3 de la hoja «Exercicis moviment parabòlic» (INS Joan Oró), enunciado en catalán, tal cual. Resultado de la hoja, con g = 10 m/s²; 866 m, 375 m, (100; 153,2) m, (50; 67) m/s y (0; −9,8) m/s².
coleccion: review-parabolico-joan-oro
dificultad: intermedio
habilidades: [vectores, planteamiento, multipaso]
resumen: Lanzamiento oblicuo desde el suelo. Alcance, altura máxima y estado del proyectil a los 2 s.
enunciado: |
  Llancem un projectil amb una velocitat inicial de **100 m/s** en una direcció que forma un angle de **60°** amb l’horitzontal. Calcula:

  a) El seu abast. b) La seva altura màxima. c) La posició, la velocitat i l’acceleració que té quan al cap de 2 segons.
datos:
  - { simbolo: 'v_0', valor: '100\un{m/s}', significado: 'velocidad inicial' }
  - { simbolo: '\alpha', valor: '60^\circ', significado: 'ángulo con la horizontal' }
  - { simbolo: '\cg{g}', valor: '-10\un{m/s^2}', significado: 'valor que usa la hoja' }
incognitas:
  - El alcance.
  - La altura máxima.
  - 'La posición, la velocidad y la aceleración en $t = 2\un{s}$.'
conceptos:
  - '$\cx{v_{0x}} = v_0\cos\alpha$ y $\cy{v_{0y}} = v_0\operatorname{sen}\alpha$.'
  - '$\cx{x} = \cx{v_{0x}}\,t$, $\cy{y} = \cy{v_{0y}}\,t - 5\,t^2$, $\cy{v_y} = \cy{v_{0y}} - 10\,t$.'
  - 'En el punto más alto, $\cy{v_y} = 0$. Al volver al suelo, $\cy{y} = 0$.'
apartados:
  - id: a
    enunciado: 'El seu abast.'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'x_{\text{máx}}'
          etiqueta: Alcance
          unidad: m
          valor: 866.0
          tolerancia: 0.025
          trampas:
            - { valor: 433.0, explicacion: 'Eso es lo que avanza hasta el **punto más alto**. Para el alcance necesitas el tiempo total, el doble.' }
            - { valor: 500, explicacion: 'Parece que has intercambiado seno y coseno. La componente horizontal es $v_0\cos 60^\circ = 50\un{m/s}$.' }
    pistas:
      - '$v_{0x} = 100\cos 60^\circ = 50\un{m/s}$ y $v_{0y} = 100\operatorname{sen}60^\circ = 86,6\un{m/s}$.'
      - 'Vuelve al suelo cuando $0 = 86,6\,t - 5\,t^2$. Saca factor común $t$.'
    pasos:
      - titulo: Componentes de la velocidad inicial
        desarrollo: |
          $$\cx{v_{0x}} = 100\cos 60^\circ = 50\un{m/s} \qquad \cy{v_{0y}} = 100\operatorname{sen}60^\circ = 86,6\un{m/s}$$
      - titulo: Tiempo de vuelo (y = 0)
        desarrollo: |
          $$0 = 86,6\,t - 5\,t^2 = t\,(86,6 - 5\,t) \;\Rightarrow\; t = 17,32\un{s}$$
        porque: 'La solución $t = 0$ es el instante del lanzamiento; la que buscamos es la otra.'
      - titulo: Alcance (eje X)
        desarrollo: |
          $$x = 50\cdot 17,32 = 866\un{m}$$
    resultado: 'El alcance es **866 m**.'
  - id: b
    enunciado: 'La seva altura màxima.'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'y_{\text{máx}}'
          etiqueta: Altura máxima
          unidad: m
          valor: 375
          tolerancia: 0.025
    pistas:
      - 'En el punto más alto, $v_y = 0$: $0 = 86,6 - 10\,t$.'
    pasos:
      - titulo: 'Punto más alto: vᵧ = 0'
        desarrollo: |
          $$0 = 86,6 - 10\,t \;\Rightarrow\; t = 8,66\un{s}$$
        porque: 'Es justo la mitad del tiempo de vuelo, porque sale y llega a la misma altura.'
      - titulo: Sustituye en y
        desarrollo: |
          $$y = 86,6\cdot 8,66 - 5\cdot 8,66^2 = 750 - 375 = 375\un{m}$$
    resultado: 'Sube hasta **375 m**.'
  - id: c
    enunciado: 'La posició, la velocitat i l’acceleració que té quan al cap de 2 segons.'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: '\cx{x}', etiqueta: 'Posición x a los 2 s', unidad: m, valor: 100 }
        - { simbolo: '\cy{y}', etiqueta: 'Posición y a los 2 s', unidad: m, valor: 153.2 }
        - { simbolo: '\cx{v_x}', etiqueta: 'Velocidad vₓ a los 2 s', unidad: m/s, valor: 50 }
        - simbolo: '\cy{v_y}'
          etiqueta: 'Velocidad vᵧ a los 2 s'
          unidad: m/s
          valor: 66.6
          trampas:
            - { valor: 86.6, explicacion: 'Esa es la velocidad vertical **inicial**. La gravedad la va frenando: $v_y = 86,6 - 10\cdot 2$.' }
        - simbolo: '\cg{a_y}'
          etiqueta: 'Aceleración vertical (con signo)'
          unidad: m/s²
          valor: -10
          tolerancia: 0.025
          trampas:
            - { valor: 0, explicacion: 'La aceleración horizontal sí es 0, pero la vertical es la de la gravedad, hacia abajo.' }
            - { valor: 10, explicacion: 'La gravedad apunta hacia abajo: con el eje Y hacia arriba, el signo es negativo.' }
    pistas:
      - 'Sustituye $t = 2$ en $x = 50\,t$, $y = 86,6\,t - 5\,t^2$ y $v_y = 86,6 - 10\,t$.'
      - 'La aceleración es siempre la misma en todo el vuelo.'
    pasos:
      - titulo: Posición
        desarrollo: |
          $$\cx{x} = 50\cdot 2 = 100\un{m} \qquad \cy{y} = 86,6\cdot 2 - 5\cdot 2^2 = 153,2\un{m}$$
      - titulo: Velocidad
        desarrollo: |
          $$\cx{v_x} = 50\un{m/s} \qquad \cy{v_y} = 86,6 - 10\cdot 2 = 66,6\un{m/s}$$
        porque: '$v_x$ no cambia nunca. $v_y$ todavía es positiva: el proyectil sigue subiendo.'
      - titulo: Aceleración
        desarrollo: |
          $$\vec a = (0,\ -10)\un{m/s^2}$$
        porque: 'Solo actúa la gravedad. La hoja escribe $(0;\ -9,8)$: es el mismo vector con el valor exacto de $g$. Las casillas aceptan los dos.'
    resultado: 'A los 2 s: posición **(100; 153,2) m**, velocidad **(50; 66,6) m/s** y aceleración **(0; −10) m/s²** (la hoja redondea $v_y$ a 67 m/s).'
errores:
  - error: 'Calcular el alcance con el tiempo hasta el punto más alto'
    explicacion: 'Hasta el punto más alto solo ha hecho la mitad del vuelo. El alcance se calcula con el tiempo total.'
  - error: 'Pensar que la aceleración es 0 en algún momento'
    explicacion: 'En el punto más alto $v_y = 0$, pero la aceleración sigue siendo $-g$ durante todo el vuelo.'
laboratorio: { v0: 100, angulo: 60, g: 10 }
