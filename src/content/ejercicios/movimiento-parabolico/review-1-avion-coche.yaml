titulo: Paquet des d’un avió a un cotxe
tema: movimiento-parabolico
orden: 201
procedencia: alumno
fuente: joan-oro-parabolico
nota_fuente: Exercici 1 del full «Exercicis moviment parabòlic» (INS Joan Oró). Resultat del full, amb g = 10 m/s²; 1.075 m i 1.454 m.
coleccion: review-parabolico-joan-oro
dificultad: intermedio
habilidades: [unidades, planteamiento, multipaso]
resumen: Un avió deixa anar un paquet sobre un cotxe en marxa. Des de quina distància, si el cotxe va en el mateix sentit o en sentit contrari?
enunciado: |
  Des d’un avió que vola a **720 km/h** horitzontalment a **200 metres** d’altura s’ha de llançar un paquet a un cotxe que va per l’autopista a **108 km/h**. A quina distància del cotxe ha de deixar anar l’avió aquest objecte? A quina distància l’hauria de deixar anar si el cotxe circulés en sentit contrari?
representacion:
  titulo: Representació gràfica del moviment
  texto: 'El paquet surt amb la velocitat de l’avió: és un **llançament horitzontal** des de 200 m. Posem l’origen a terra, just a sota del punt on es deixa anar.'
  figura:
    tipo: lanzamiento
    v0: 200
    angulo: 0
    h0: 200
    g: 10
    soporte: avion
    ejes: true
    etiquetas: { v0: 'v₀ₓ = 200 m/s', h0: '200 m', alcance: 'x = ?' }
datos:
  - { simbolo: 'y_0', valor: '200\un{m}', significado: 'altura de l’avió' }
  - { simbolo: '\cx{v_{0x}}', valor: '720\un{km/h} = 200\un{m/s}', significado: 'el paquet surt amb la velocitat de l’avió' }
  - { simbolo: 'v_{\text{cotxe}}', valor: '108\un{km/h} = 30\un{m/s}', significado: 'velocitat constant del cotxe' }
  - { simbolo: '\cg{g}', valor: '-10\un{m/s^2}', significado: 'valor que fa servir el full' }
incognitas:
  - 'La distància horitzontal entre l’avió i el cotxe en deixar anar el paquet (cotxe en el mateix sentit).'
  - 'La mateixa distància si el cotxe va en sentit contrari.'
interpretacion: |
  El paquet és un **llançament horitzontal**: surt amb els 200 m/s de l’avió. Mentre cau, el cotxe també es mou. Per això no n’hi ha prou de saber quant avança el paquet: cal restar-hi (o sumar-hi) el que avança el cotxe en el mateix temps.
conceptos:
  - 'De km/h a m/s es divideix entre 3,6.'
  - '$\cx{x} = \cx{v_{0x}}\,t$ i $\cy{y} = 200 - 5\,t^2$ (amb $g = 10\un{m/s^2}$).'
  - 'El cotxe fa un MRU: $x_{\text{cotxe}} = v_{\text{cotxe}}\,t$.'
apartados:
  - id: a
    enunciado: 'A quina distància del cotxe ha de deixar anar l’avió aquest objecte?'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 't', etiqueta: Temps de caiguda del paquet, unidad: s, valor: 6.325 }
        - simbolo: 'd'
          etiqueta: Distància al cotxe (mateix sentit)
          unidad: m
          valor: 1075.2
          trampas:
            - { valor: 1264.9, explicacion: 'Això és el que avança el **paquet**. Mentre cau, el cotxe s’allunya 190 m més: cal restar-los.' }
            - { valor: 4300, explicacion: 'Sembla que has fet servir les velocitats en km/h. Passa-les abans a m/s (÷ 3,6).' }
    pistas:
      - 'Passa les velocitats a m/s: $720/3,6$ i $108/3,6$.'
      - 'El temps de caiguda només depèn de l’altura: $0 = 200 - 5\,t^2$.'
      - 'En aquest temps el paquet avança $200\,t$ i el cotxe $30\,t$. La distància que busques és la diferència.'
    pasos:
      - titulo: Velocitats en m/s
        desarrollo: |
          $$\cx{v_{0x}} = \frac{720}{3,6} = 200\un{m/s} \qquad v_{\text{cotxe}} = \frac{108}{3,6} = 30\un{m/s}$$
      - titulo: Temps de caiguda (eix Y)
        desarrollo: |
          $$0 = 200 - 5\,t^2 \;\Rightarrow\; t = \sqrt{40} = 6,32\un{s}$$
        porque: 'La velocitat vertical inicial és 0: l’avió vola en horitzontal.'
      - titulo: El que avança cadascun (eix X)
        desarrollo: |
          $$x_{\text{paquet}} = 200\cdot 6,32 = 1265\un{m} \qquad x_{\text{cotxe}} = 30\cdot 6,32 = 190\un{m}$$
      - titulo: Distància en deixar-lo anar
        piensa: 'Si el cotxe s’allunya mentre el paquet cau, l’avió l’ha de deixar anar més a prop o més lluny del que avança el paquet?'
        desarrollo: |
          $$d = x_{\text{paquet}} - x_{\text{cotxe}} = (200 - 30)\cdot 6,32 = 1075\un{m}$$
        porque: 'El paquet ha d’«atrapar» el cotxe, que també avança. És el mateix que fer servir la velocitat relativa, 200 − 30 = 170 m/s.'
    resultado: 'L’ha de deixar anar quan el cotxe sigui **1.075 m** per davant (en horitzontal).'
  - id: b
    enunciado: 'A quina distància l’hauria de deixar anar si el cotxe circulés en sentit contrari?'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 'd'
          etiqueta: Distància al cotxe (sentit contrari)
          unidad: m
          valor: 1454.6
          trampas:
            - { valor: 1075.2, explicacion: 'Aquesta és la de l’apartat anterior. Ara el cotxe ve cap a l’avió: el seu desplaçament se **suma**.' }
            - { valor: 1264.9, explicacion: 'Això és només el que avança el paquet. Falta sumar-hi el que s’acosta el cotxe.' }
    pistas:
      - 'El temps de caiguda és el mateix: 6,32 s.'
      - 'Ara el cotxe s’acosta: els dos recorreguts se sumen.'
    pasos:
      - titulo: Mateix temps, el cotxe s’acosta
        desarrollo: |
          $$d = x_{\text{paquet}} + x_{\text{cotxe}} = (200 + 30)\cdot 6,32 = 1455\un{m}$$
        porque: 'El temps de caiguda no depèn del cotxe. L’únic que canvia és el sentit del seu moviment.'
    resultado: 'L’hauria de deixar anar amb el cotxe a **1.455 m** (el full dona 1.454 m, per arrodoniment).'
errores:
  - error: 'Oblidar que el cotxe es mou'
    explicacion: 'Els 1.265 m són el que avança el paquet respecte a terra. El cotxe no està quiet: cal restar o sumar el seu desplaçament.'
  - error: 'Barrejar km/h i m/s'
    explicacion: 'Amb $g$ en m/s² el temps surt en segons; les velocitats també han d’estar en m/s.'
