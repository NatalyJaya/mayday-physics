titulo: Arriba al terrat o xoca amb la paret?
tema: movimiento-parabolico
orden: 205
procedencia: alumno
fuente: joan-oro-parabolico
nota_fuente: Exercici 5 del full «Exercicis moviment parabòlic» (INS Joan Oró). Resultat del full; arriba al terrat, 28 m.
coleccion: review-parabolico-joan-oro
dificultad: avanzado
habilidades: [planteamiento, matematicas, multipaso]
resumen: Un objecte llançat a 20 m/s i 45° cap a un edifici de 8 m a 22 m de distància. On cau?
enunciado: |
  Des de terra llenço un objecte amb una velocitat de **20 m/s** i amb un angle de **45 graus**. A **22 metres** hi ha un edifici de **8 metres** d’alçada amb un terrat molt ample i llarg.

  a) Arribarà aquest objecte al terrat o bé xocarà contra la paret vertical d’aquest edifici? b) Si arriba al terrat, a quin lloc del terrat caurà exactament l’objecte? c) Si xoca amb la paret, on tindrà lloc l’impacte?
representacion:
  titulo: Representació gràfica del moviment
  texto: 'L’objecte surt de l’origen. Primer cal mirar la seva altura a $x = 22\un{m}$, on comença l’edifici de 8 m; si supera els 8 m, cau sobre el terrat quan torna a baixar a $y = 8\un{m}$.'
  figura:
    tipo: lanzamiento
    v0: 20
    angulo: 45
    g: 10
    llegada: 8
    ejes: true
    etiquetas: { v0: 'v₀ = 20 m/s' }
    marcas:
      - { tipo: edificio, x: 22, altura: 8 }
    claves:
      - { t: 1.5556, etiqueta: 'x = 22 m, y = ?' }
    ancho: 36
datos:
  - { simbolo: 'v_0', valor: '20\un{m/s}', significado: 'velocitat inicial' }
  - { simbolo: '\alpha', valor: '45^\circ', significado: 'angle de llançament' }
  - { simbolo: 'x_{\text{paret}}', valor: '22\un{m}', significado: 'distància a la paret de l’edifici' }
  - { simbolo: 'h', valor: '8\un{m}', significado: 'altura de l’edifici' }
  - { simbolo: '\cg{g}', valor: '-10\un{m/s^2}', significado: 'valor que fa servir el full' }
incognitas:
  - 'L’altura de l’objecte en arribar a la paret ($x = 22\un{m}$).'
  - 'Si arriba al terrat, el punt on cau ($y = 8\un{m}$ baixant).'
interpretacion: |
  Primer mirem a quina altura és l’objecte quan arriba a la paret. Si és per sobre de 8 m, la supera i acaba caient **sobre el terrat**: aleshores el punt de caiguda és on la trajectòria torna a baixar a $y = 8\un{m}$, no a $y = 0$.
conceptos:
  - '$\cx{x} = v_0\cos\alpha\cdot t$ i $\cy{y} = v_0\operatorname{sin}\alpha\cdot t - 5\,t^2$.'
  - 'Una equació de segon grau en $t$ dona dos instants a la mateixa altura: un pujant i un altre baixant.'
apartados:
  - id: a
    enunciado: 'Arribarà aquest objecte al terrat o bé xocarà contra la paret vertical d’aquest edifici?'
    respuesta:
      tipo: numerica
      campos:
        - { simbolo: 't', etiqueta: 'Instant en què arriba a la paret', unidad: s, valor: 1.556 }
        - { simbolo: 'y', etiqueta: 'Altura en arribar a la paret', unidad: m, valor: 9.90 }
    pistas:
      - '$v_{0x} = v_{0y} = 20\cos 45^\circ = 14,14\un{m/s}$.'
      - 'Busca $t$ amb $22 = 14,14\,t$ i substitueix-lo a l’equació de $y$. Compara amb 8 m.'
    pasos:
      - titulo: Components
        desarrollo: |
          $$\cx{v_{0x}} = \cy{v_{0y}} = 20\cos 45^\circ = 14,14\un{m/s}$$
        porque: 'A 45° el sinus i el cosinus són iguals.'
      - titulo: Instant en què arriba a la paret
        desarrollo: |
          $$22 = 14,14\,t \;\Rightarrow\; t = 1,556\un{s}$$
      - titulo: Altura en aquest instant
        desarrollo: |
          $$y = 14,14\cdot 1,556 - 5\cdot 1,556^2 = 22 - 12,1 = 9,90\un{m} > 8\un{m}$$
        porque: 'Passa 1,9 m per sobre de la vora: no xoca amb la paret, arriba al terrat.'
    resultado: '**Arriba al terrat**: en passar per la paret és a 9,90 m, per sobre dels 8 m de l’edifici.'
  - id: b
    enunciado: 'Si arriba al terrat, a quin lloc del terrat caurà exactament l’objecte?'
    respuesta:
      tipo: numerica
      campos:
        - simbolo: 't'
          etiqueta: Instant en què cau sobre el terrat
          unidad: s
          valor: 2.047
          trampas:
            - { valor: 0.782, explicacion: 'Aquesta és la solució en què l’objecte és a 8 m **pujant**, abans d’arribar a la paret. Necessites l’altra.' }
            - { valor: 2.828, explicacion: 'Aquest és el temps fins a tornar a $y = 0$. Però cau sobre el terrat, que és a 8 m.' }
        - simbolo: 'x'
          etiqueta: Distància horitzontal des del llançament
          unidad: m
          valor: 28.94
          tolerancia: 0.035
          trampas:
            - { valor: 40, explicacion: 'Aquest seria l’abast si caigués a terra. Però el terrat és a 8 m: busca quan $y = 8$.' }
            - { valor: 6.94, explicacion: 'Aquesta és la distància **des de la paret**. Aquí es demana des del punt de llançament: suma-hi els 22 m.' }
    pistas:
      - 'Cau sobre el terrat quan $y = 8\un{m}$: $8 = 14,14\,t - 5\,t^2$.'
      - 'Surten dues solucions. La bona és la més gran: la primera és quan passa per 8 m pujant.'
    pasos:
      - titulo: Equació de l’eix Y a 8 m
        desarrollo: |
          $$8 = 14,14\,t - 5\,t^2 \;\Rightarrow\; 5\,t^2 - 14,14\,t + 8 = 0$$

          $$t = \frac{14,14 \pm \sqrt{14,14^2 - 4\cdot 5\cdot 8}}{2\cdot 5} = \frac{14,14 \pm 6,32}{10}$$
      - titulo: Tria la solució
        piensa: 'Les dues solucions són moments en què l’objecte és a 8 m. Quina és la caiguda sobre el terrat?'
        desarrollo: |
          $$t_1 = 0,78\un{s}\ \text{(pujant)} \qquad t_2 = 2,05\un{s}\ \text{(baixant)}$$
        porque: 'A $t_1$ encara no ha arribat a la paret ($x = 11\un{m}$). La caiguda és a $t_2$.'
      - titulo: Posició horitzontal
        desarrollo: |
          $$x = 14,14\cdot 2,047 = 28,9\un{m}$$
        porque: 'És més enllà de la paret (22 m), així que és un punt del terrat, a 6,9 m de la vora.'
    resultado: 'Cau a uns **28,9 m** del punt de llançament, és a dir, a 6,9 m de la vora del terrat. El full dona **28 m**; la casella accepta tots dos.'
  - id: c
    enunciado: 'Si xoca amb la paret, on tindrà lloc l’impacte?'
    respuesta:
      tipo: abierta
      criterio: 'Com que l’objecte arriba al terrat, aquest apartat no s’aplica.'
    pasos:
      - titulo: No s’aplica
        desarrollo: 'A l’apartat a) hem vist que l’objecte passa per sobre de la paret (a 9,90 m), així que **no hi xoca**.'
    resultado: 'No s’aplica: l’objecte arriba al terrat.'
errores:
  - error: 'Calcular on cau amb y = 0'
    explicacion: 'L’objecte cau sobre el terrat, que és a 8 m. El punt de caiguda es busca amb $y = 8\un{m}$.'
  - error: 'Quedar-se amb la primera solució de l’equació de segon grau'
    explicacion: 'Les dues solucions són reals: una quan puja i una altra quan baixa. Comprova sempre quina té sentit.'
laboratorio: { v0: 20, angulo: 45, g: 10 }
